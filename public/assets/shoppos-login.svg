<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
    <rect width="1200" height="800" fill="#0f172a"/>
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
      </pattern>
      <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#grid)"/>
    <rect x="80" y="80" width="1040" height="640" rx="16" fill="url(#grad)" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.4"/>
    
    <circle cx="120" cy="120" r="8" fill="#ef4444"/>
    <circle cx="145" cy="120" r="8" fill="#f59e0b"/>
    <circle cx="170" cy="120" r="8" fill="#10b981"/>
    
    <text x="600" y="380" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#f8fafc" text-anchor="middle">ShopPOS — Authentication</text>
    <text x="600" y="440" font-family="system-ui, monospace" font-size="22" font-weight="500" fill="#94a3b8" text-anchor="middle">Role-based cashier & store owner access portal</text>
    <text x="600" y="520" font-family="system-ui, monospace" font-size="16" fill="#64748b" text-anchor="middle">// DEWMINI WEERAPPERUMA PORTFOLIO DEMO</text>
  </svg>